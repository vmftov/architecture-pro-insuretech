apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
    name: scaletestapp-autoscaler-sm
    namespace: insuretech
    labels:
        release: prometheus-operator
spec:
    endpoints:
        - port: metrics
    namespaceSelector:
        matchNames:
            - insuretech
    selector:
        matchLabels:
            app: scaletestapp
